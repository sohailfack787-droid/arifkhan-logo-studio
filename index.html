<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عارف لوگو سٹوڈیو | Arif Logo Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      padding: 18px;
    }
    .top-bar {
      max-width: 660px;
      margin: 0 auto 14px;
      display: flex;
      justify-content: flex-start;
    }
    .corner-profile {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
    }
    .corner-profile img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #38bdf8;
    }
    .corner-profile span {
      font-size: 13px;
      font-weight: 700;
    }
    .container {
      max-width: 660px;
      margin: 0 auto 30px;
      background: rgba(30, 41, 59, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 26px;
      text-align: center;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 22px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #e2e8f0;
    }
    input[type="text"], select, input[type="color"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
    }
    input[type="color"] {
      height: 44px;
      padding: 4px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .preview-box {
      margin: 22px 0;
      background: #020617;
      border: 1px dashed #475569;
      border-radius: 16px;
      padding: 28px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 240px;
    }
    .logo-frame {
      width: 210px;
      height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 18px;
      transition: all 0.25s ease;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    /* اسٹائل 1: گول کنارے (Rounded) */
    .style-rounded {
      border-radius: 28px;
      border: 3px solid rgba(255, 255, 255, 0.22);
    }

    /* اسٹائل 2: بیج (Badge) */
    .style-badge {
      border-radius: 50%;
      border: 6px double rgba(255, 255, 255, 0.75);
      outline: 3px solid rgba(255, 255, 255, 0.2);
    }

    /* اسٹائل 3: شیلڈ (Shield) */
    .style-shield {
      clip-path: polygon(50% 0%, 92% 14%, 85% 62%, 50% 100%, 15% 62%, 8% 14%);
      border-radius: 0;
      padding-bottom: 28px;
    }

    /* اسٹائل 4: مونوگرام (Monogram) */
    .style-monogram {
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 0 0 5px rgba(15, 23, 42, 0.25), 0 14px 32px rgba(0, 0, 0, 0.45);
    }

    .mono-letters {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 4px;
      display: none;
    }
    .style-monogram .mono-letters {
      display: block;
    }
    .style-monogram .logo-title {
      font-size: 16px;
      font-weight: 700;
    }

    .logo-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      word-break: break-word;
    }
    .logo-tag {
      font-size: 12px;
      margin-top: 6px;
      opacity: 0.9;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      flex: 1;
      min-width: 150px;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary {
      background: #0284c7;
      color: #fff;
    }
    .btn-secondary {
      background: #334155;
      color: #fff;
    }
    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      color: #4ade80;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="corner-profile" onclick="document.getElementById('avatarInput').click()" title="پروفائل تصویر تبدیل کریں">
      <img id="avatarImg" src="https://ui-avatars.com/api/?name=Arif+Khan&background=0284c7&color=fff" alt="Profile" />
      <span>عارف خان</span>
      <input type="file" id="avatarInput" accept="image/*" style="display:none" />
    </div>
  </div>

  <div class="container">
    <h1>عارف لوگو سٹوڈیو</h1>
    <p class="subtitle">بیج، شیلڈ یا مونوگرام منتخب کریں اور اپنا برانڈ لوگو تیار کریں</p>

    <div class="form-group">
      <label for="brandName">لوگو کا نام / برانڈ</label>
      <input type="text" id="brandName" placeholder="مثال: Arif Khan" value="Arif Khan" />
    </div>

    <div class="form-group">
      <label for="tagline">ٹیگ لائن (اختیاری)</label>
      <input type="text" id="tagline" placeholder="مثال: Logo Studio" value="Logo Studio" />
    </div>

    <div class="form-group">
      <label for="logoStyle">لوگو اسٹائل</label>
      <select id="logoStyle">
        <option value="style-badge">بیج (Badge)</option>
        <option value="style-shield">شیلڈ (Shield)</option>
        <option value="style-monogram">مونوگرام (Monogram)</option>
        <option value="style-rounded">گول کارڈ (Rounded)</option>
      </select>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="bgColor">پس منظر کا رنگ</label>
        <input type="color" id="bgColor" value="#0284c7" />
      </div>
      <div class="form-group">
        <label for="textColor">تحریر کا رنگ</label>
        <input type="color" id="textColor" value="#ffffff" />
      </div>
    </div>

    <div class="preview-box">
      <div id="logoFrame" class="logo-frame style-badge">
        <div id="monoLetters" class="mono-letters">AK</div>
        <div id="logoTitle" class="logo-title">Arif Khan</div>
        <div id="logoTag" class="logo-tag">Logo Studio</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="copyShareLink()">شیئر ایبل لنک کاپی کریں</button>
      <button class="btn-secondary" onclick="resetStudio()">ری سیٹ کریں</button>
    </div>

    <div id="statusMsg" class="status"></div>
  </div>

  <script>
    const brandName = document.getElementById("brandName");
    const tagline = document.getElementById("tagline");
    const logoStyle = document.getElementById("logoStyle");
    const bgColor = document.getElementById("bgColor");
    const textColor = document.getElementById("textColor");
    const logoFrame = document.getElementById("logoFrame");
    const monoLetters = document.getElementById("monoLetters");
    const logoTitle = document.getElementById("logoTitle");
    const logoTag = document.getElementById("logoTag");
    const statusMsg = document.getElementById("statusMsg");
    const avatarInput = document.getElementById("avatarInput");
    const avatarImg = document.getElementById("avatarImg");

    function getMonogram(text) {
      const words = text.trim().split(/\s+/).filter(Boolean);
      if (words.length === 0) return "AK";
      if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function updateLogo() {
      const nameVal = brandName.value.trim() || "Arif Khan";
      logoTitle.textContent = nameVal;
      monoLetters.textContent = getMonogram(nameVal);
      logoTag.textContent = tagline.value.trim();

      logoFrame.className = "logo-frame " + logoStyle.value;
      logoFrame.style.background = bgColor.value;
      logoFrame.style.color = textColor.value;
    }

    [brandName, tagline, logoStyle, bgColor, textColor].forEach(el => {
      el.addEventListener("input", updateLogo);
      el.addEventListener("change", updateLogo);
    });

    avatarInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        avatarImg.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    function copyShareLink() {
      const shareUrl = window.location.href;
      navigator.clipboard.writeText(shareUrl).then(() => {
        statusMsg.textContent = "لنک کاپی ہو گیا: " + shareUrl;
      }).catch(() => {
        statusMsg.textContent = "لنک: " + shareUrl;
      });
    }

    function resetStudio() {
      brandName.value = "Arif Khan";
      tagline.value = "Logo Studio";
      logoStyle.value = "style-badge";
      bgColor.value = "#0284c7";
      textColor.value = "#ffffff";
      updateLogo();
      statusMsg.textContent = "سیٹنگز ری سیٹ ہو گئیں۔";
    }

    updateLogo();
  </script>
</body>
</html>
